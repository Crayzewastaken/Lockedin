name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk LockedIn.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LockedIn-apk
          path: LockedIn.apk

      # Publishes the APK as a direct download at /releases/latest
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" LockedIn.apk \
            --title "Locked In (build ${{ github.run_number }})" \
            --notes "Download LockedIn.apk below and open it on your Android phone." \
            --latest
